<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Tools - Mero App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #1a1a1a;
            --bg-hover: #252525;
            --border-color: #272727;
            --text-primary: #ffffff;
            --text-secondary: #e0e0e0;
            --text-muted: #aaaaaa;
            --text-dim: #888888;
            --accent: #e94560;
        }

        [data-theme="light"] {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-hover: #f0f0f0;
            --border-color: #e0e0e0;
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a4a;
            --text-muted: #6a6a6a;
            --text-dim: #8a8a8a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg-primary); 
            color: var(--text-primary); 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Header */
        .app-header { 
            background-color: rgba(15, 15, 15, 0.85); 
            padding: 14px 20px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        [data-theme="light"] .app-header { background-color: rgba(245, 245, 247, 0.85); }
        
        .header-content { display: flex; align-items: center; gap: 12px; max-width: 600px; margin: 0 auto; }
        .header-btn {
            width: 36px; height: 36px; border-radius: 10px; background: var(--bg-secondary);
            border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease; color: var(--text-primary); text-decoration: none;
        }
        .header-btn:hover { background: var(--bg-hover); }
        .header-btn i { font-size: 1.1rem; }
        .header-title { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); flex: 1; }

        /* Main Container */
        .page-container { padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 40px; }
        .section-header { margin-bottom: 16px; }
        .section-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
        .section-title i { color: var(--text-primary); } /* Changed to match B&W theme */
        .section-subtitle { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }

        /* Tools Grid */
        .tools-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

        /* Tool Card */
        .tool-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 20px 16px; cursor: pointer; transition: all 0.25s ease; position: relative;
            overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
        }
        .tool-card:hover { 
            background: var(--bg-hover); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15); 
            border-color: var(--text-dim); 
        }
        .tool-card:active { transform: scale(0.97); }

        /* ✅ BLACK & WHITE ICONS */
        .tool-icon-wrapper {
            width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 1.4rem; 
            background-color: #252525; /* Dark mode: Dark Gray */
            color: #ffffff;            /* Dark mode: White Icon */
            border: 1px solid #333333;
            transition: all 0.25s ease;
        }
        [data-theme="light"] .tool-icon-wrapper {
            background-color: #e8e8e8; /* Light mode: Light Gray */
            color: #1a1a1a;            /* Light mode: Black Icon */
            border-color: #d0d0d0;
        }
        .tool-card:hover .tool-icon-wrapper {
            background-color: #000000; /* Hover: Pure Black */
            color: #ffffff;            /* Hover: White Icon */
            border-color: #000000;
        }
        [data-theme="light"] .tool-card:hover .tool-icon-wrapper {
            background-color: #1a1a1a; /* Light mode Hover: Pure Black */
            color: #ffffff;
            border-color: #1a1a1a;
        }

        .tool-info { flex: 1; }
        .tool-name { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
        .tool-desc { font-size: 0.75rem; color: var(--text-muted); line-height: 1.3; }
        .tool-arrow { position: absolute; top: 16px; right: 16px; color: var(--text-dim); font-size: 1rem; transition: transform 0.25s ease; }
        .tool-card:hover .tool-arrow { transform: translateX(3px); color: var(--text-primary); }

        /* Modal Styles */
        .modal-content { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 16px; }
        .modal-header { border-bottom: 1px solid var(--border-color); padding: 16px 20px; }
        .modal-title { font-weight: 700; font-size: 1.1rem; }
        .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }
        [data-theme="light"] .btn-close-white { filter: none; }
        .modal-body { padding: 20px; }
        .widget-container { width: 100%; border-radius: 12px; overflow: hidden; background: var(--bg-secondary); border: 1px solid var(--border-color); }
        .widget-container iframe { display: block; width: 100%; }
        .widget-copyright { text-align: left; font-size: 0.75rem; color: var(--text-muted); padding: 8px 12px; background: var(--bg-secondary); border-top: 1px solid var(--border-color); }
        .widget-copyright a { color: var(--text-primary); text-decoration: none; font-weight: 500; }
        .widget-copyright a:hover { text-decoration: underline; }

        /* Toast */
        .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; }
        .toast-custom { background: var(--bg-card); color: var(--text-primary); padding: 12px 20px; border-radius: 10px; border-left: 4px solid var(--text-primary); box-shadow: 0 4px 20px rgba(0,0,0,0.4); font-weight: 500; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <a href="index.html" class="header-btn" title="Back to Home"><i class="bi bi-arrow-left"></i></a>
            <h5 class="header-title mb-0">Utility Tools</h5>
        </div>
    </header>

    <div class="page-container">
        <div class="section-header">
            <div class="section-title"><i class="bi bi-tools"></i> Daily Utilities</div>
            <div class="section-subtitle">Tap on a tool to view details</div>
        </div>

        <div class="tools-grid">
            <div class="tool-card" onclick="openTool('gold')">
                <div class="tool-icon-wrapper"><i class="bi bi-gem"></i></div>
                <div class="tool-info"><div class="tool-name">Gold & Silver</div><div class="tool-desc">Live rates in Nepal</div></div>
                <i class="bi bi-chevron-right tool-arrow"></i>
            </div>

            <div class="tool-card" onclick="openTool('forex')">
                <div class="tool-icon-wrapper"><i class="bi bi-currency-exchange"></i></div>
                <div class="tool-info"><div class="tool-name">Forex Rates</div><div class="tool-desc">NRB daily exchange rates</div></div>
                <i class="bi bi-chevron-right tool-arrow"></i>
            </div>

            <div class="tool-card" onclick="openTool('fuel')">
                <div class="tool-icon-wrapper"><i class="bi bi-fuel-pump"></i></div>
                <div class="tool-info"><div class="tool-name">Fuel Rates</div><div class="tool-desc">Petrol, Diesel, Kerosene</div></div>
                <i class="bi bi-chevron-right tool-arrow"></i>
            </div>

            <div class="tool-card" onclick="openTool('falful')">
                <div class="tool-icon-wrapper"><i class="bi bi-basket"></i></div>
                <div class="tool-info"><div class="tool-name">Falfulbazar</div><div class="tool-desc">Daily vegetable prices</div></div>
                <i class="bi bi-chevron-right tool-arrow"></i>
            </div>

            <div class="tool-card" onclick="openTool('date')">
                <div class="tool-icon-wrapper"><i class="bi bi-calendar2-check"></i></div>
                <div class="tool-info"><div class="tool-name">Date Converter</div><div class="tool-desc">BS to AD / AD to BS</div></div>
                <i class="bi bi-chevron-right tool-arrow"></i>
            </div>

            <div class="tool-card" onclick="openTool('unicode')">
                <div class="tool-icon-wrapper"><i class="bi bi-translate"></i></div>
                <div class="tool-info"><div class="tool-name">Unicode</div><div class="tool-desc">Preeti to Unicode converter</div></div>
                <i class="bi bi-chevron-right tool-arrow"></i>
            </div>
        </div>
    </div>

    <!-- Dynamic Widget Modal -->
    <div class="modal fade" id="widgetModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Tool Name</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="widget-container" id="modalWidgetContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadTheme() {
            const savedTheme = localStorage.getItem('mero_app_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        const toolsData = {
            'gold': {
                title: 'Gold & Silver Rates',
                html: `<iframe src="https://www.ashesh.com.np/gold/widget.php?api=771090q521&header_color=0077e5" frameborder="0" scrolling="no" style="border:none; overflow:hidden; width:100%; height:265px;" allowtransparency="true"></iframe><div class="widget-copyright">© <a href="https://www.ashesh.com.np/gold/" title="Gold & Silver Rates Nepal" target="_top">Gold & Silver Rates Nepal</a></div>`},
            'forex': { 
                      title: 'Forex Rates', 
                      html: `<iframe src="https://www.ashesh.com.np/forex/widget2.php?api=711190q111&header_color=38b45e&background_color=faf8ee&header_title=Nepal%20Exchange%20Rates" frameborder="0" scrolling="yes" marginwidth="0" marginheight="0" style="border:none; overflow:hidden; width:100%; height:383px; border-radius:5px;  scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.3) transparent;" allowtransparency="true">
</iframe><br><span style="text-align:left">© <a href="https://www.ashesh.com.np/forex/" title="Nepal Exchange Rates for Nepalese Rupee" target="_top" style="text-decoration:none;">Nepal Exchange Rates</a></span>` },
            'fuel': { title: 'Fuel Rates', html: `<iframe src="https://www.ashesh.com.np/fuel/widget.php?api=711198q046&title=Nepal%20Fuel%20Rates&header_color=dedede&header_text_color=303030" frameborder="0" scrolling="yes" marginwidth="0" marginheight="0" style="border:none; overflow:hidden; width:100%; height:275px; border-radius:5px; scrollbar-width: thin; scrollbar-color: rgba(0,0,0,0.3) transparent;" allowtransparency="true">
</iframe><br><span style="text-align:left">© <a href="https://www.ashesh.com.np/fuel/" title="Fuel Rates Nepal" target="_top" style="text-decoration:none;">Fuel Rates Nepal</a></span>` },
            'falful': { title: 'Falfulbazar', html: `<iframe width="100%", height="265" src="https://www.ashesh.com.np/vegetable/widget.php?api=711191q175&header_color=519122" frameborder="0" scrolling="yes" style="border:none; overflow:hidden; border-radius:5px; scrollbar-width: thin;">
</iframe><br><span style="text-align:left">© <a href="https://www.ashesh.com.np/vegetable/" title="Vegetable & Fruit Market Nepal" target="_top" style="text-decoration:none;">Vegetable & Fruit Market Nepal</a></span>` },
            'date': { title: 'Date Converter', html: `<iframe src="https://www.ashesh.com.np/linkdate-converter.php?h_color=21ADE2&b_color=CFE4B1&api=711191q153" frameborder="0" scrolling="no" marginwidth="0" marginheight="0" style="border:none; overflow:hidden; width:100%; height:186px;" allowtransparency="true"></iframe><br><span style="color:#6D6D6D; font-size:8px; text-align:left">Powered by © <a href="https://www.ashesh.com.np/nepali-date-converter.php" title="Nepali date converter" target="_top" style="text-decoration:none; color:#6D6D6D;">nepali date converter</a></span>` },
            'unicode': { title: 'Unicode Converter', html: `<iframe width="100%" height="400" frameborder="0" border="no" scrolling="no" marginwidth="0" marginheight="0" allowtransparency="true" src="https://www.ashesh.com.np/linknepali-unicode3.php?api=711192q136">
</iframe><br><span style="color:gray; font-size:8px; text-align:left">© <a href="https://www.ashesh.com.np/nepali-unicode.php" title="Nepali unicode" target="_top" style="text-decoration:none; color:gray;">Nepali Unicode</a></span>` }
        };

        let widgetModalInstance = null;
        function openTool(toolKey) {
            const tool = toolsData[toolKey];
            if (tool) {
                document.getElementById('modalTitle').textContent = tool.title;
                document.getElementById('modalWidgetContainer').innerHTML = tool.html;
                if (!widgetModalInstance) widgetModalInstance = new bootstrap.Modal(document.getElementById('widgetModal'));
                widgetModalInstance.show();
            }
        }

        document.getElementById('widgetModal').addEventListener('hidden.bs.modal', function () {
            document.getElementById('modalWidgetContainer').innerHTML = '';
        });

        function showToast(message) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-custom';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 2500);
        }

        loadTheme();
    </script>
</body>
</html>
