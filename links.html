<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f0f">
    <title>Links - Mero App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f0f; --bg-secondary: #1a1a1a; --bg-card: #1a1a1a; --bg-hover: #252525;
            --border-color: #272727; --text-primary: #ffffff; --text-secondary: #e0e0e0;
            --text-muted: #aaaaaa; --text-dim: #666666; --accent: #ffffff;
        }
        [data-theme="light"] {
            --bg-primary: #f5f5f7; --bg-secondary: #ffffff; --bg-card: #ffffff; --bg-hover: #f0f0f0;
            --border-color: #e0e0e0; --text-primary: #1a1a1a; --text-secondary: #4a4a4a;
            --text-muted: #6a6a6a; --text-dim: #9a9a9a; --accent: #000000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }

        .app-header { background-color: rgba(15, 15, 15, 0.85); padding: 14px 20px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); backdrop-filter: blur(20px); }
        [data-theme="light"] .app-header { background-color: rgba(245, 245, 247, 0.85); }
        .header-content { display: flex; align-items: center; justify-content: space-between; max-width: 600px; margin: 0 auto; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--bg-secondary); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; color: var(--text-primary); text-decoration: none; }
        .header-btn:hover { background: var(--bg-hover); transform: translateY(-1px); }
        .header-btn i { font-size: 1.1rem; }
        .header-title { font-size: 1.15rem; font-weight: 700; color: var(--text-primary); letter-spacing: 1px; }
        .add-btn { background: var(--accent); color: var(--bg-primary); border: none; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; }
        .add-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        .page-container { padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 40px; }
        .search-container { position: relative; margin-bottom: 16px; }
        .search-input { width: 100%; padding: 14px 16px 14px 44px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-primary); font-size: 0.95rem; outline: none; }
        .search-input:focus { border-color: var(--accent); }
        .search-input::placeholder { color: var(--text-dim); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 1.1rem; }

        .category-filter { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
        .category-filter::-webkit-scrollbar { display: none; }
        .category-chip { padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .category-chip:hover { border-color: var(--text-muted); }
        .category-chip.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }

        .links-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

        .link-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; transition: all 0.2s ease; cursor: pointer; height: 80px; overflow: hidden; }
        .link-row:hover { background: var(--bg-hover); border-color: var(--text-dim); transform: translateY(-2px); }

        .link-favicon { width: 36px; height: 36px; border-radius: 8px; background: var(--bg-secondary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; border: 1px solid var(--border-color); }
        .link-favicon img { width: 100%; height: 100%; object-fit: cover; }
        .link-favicon i { font-size: 1rem; color: var(--text-muted); }

        .link-content { flex: 1; min-width: 0; overflow: hidden; }
        .link-title { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .link-url { font-size: 0.65rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
        .link-meta { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
        .link-category { display: inline-flex; align-items: center; padding: 1px 6px; background: var(--bg-hover); border-radius: 8px; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0; }

        .link-actions { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 3px; flex-shrink: 0; padding-left: 6px; border-left: 1px solid var(--border-color); }
        .link-action-btn { width: 26px; height: 26px; border-radius: 6px; border: none; background: transparent; color: var(--text-dim); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; text-decoration: none; font-size: 0.8rem; }
        .link-action-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .link-action-btn.visit { color: var(--accent); }
        .link-action-btn.visit:hover { background: var(--accent); color: var(--bg-primary); }
        .link-action-btn.delete { color: #dc3545; }
        .link-action-btn.delete:hover { background: #dc3545; color: white; }
        .link-action-btn i { font-size: 0.85rem; }

        .cat-social { background: rgba(233, 69, 96, 0.15); color: #e94560; }
        .cat-news { background: rgba(33, 150, 243, 0.15); color: #2196f3; }
        .cat-shopping { background: rgba(255, 152, 0, 0.15); color: #ff9800; }
        .cat-entertainment { background: rgba(156, 39, 176, 0.15); color: #9c27b0; }
        .cat-education { background: rgba(76, 175, 80, 0.15); color: #4caf50; }
        .cat-other { background: rgba(96, 125, 139, 0.15); color: #607d8b; }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); grid-column: 1 / -1; }
        .empty-state i { font-size: 4rem; margin-bottom: 16px; color: var(--text-dim); }
        .empty-state h5 { color: var(--text-primary); margin-bottom: 8px; }
        .loading-container { text-align: center; padding: 40px; color: var(--text-muted); grid-column: 1 / -1; }
        .loading-container .spinner-border { width: 2rem; height: 2rem; color: var(--accent); }

        .modal-content { background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 16px; }
        .modal-header { border-bottom: 1px solid var(--border-color); padding: 16px 20px; }
        .modal-title { font-weight: 700; font-size: 1.1rem; }
        .btn-close-white { filter: invert(1) grayscale(100%) brightness(200%); }
        [data-theme="light"] .btn-close-white { filter: none; }
        .modal-body { padding: 20px; }
        .modal-footer { border-top: 1px solid var(--border-color); padding: 16px 20px; }
        .form-control, .form-select { background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-primary); }
        .form-control:focus, .form-select:focus { background: var(--bg-secondary); color: var(--text-primary); border-color: var(--accent); box-shadow: 0 0 0 0.2rem rgba(255, 255, 255, 0.1); }
        .form-label { color: var(--text-secondary); font-weight: 500; margin-bottom: 8px; }
        .btn-custom-primary { background: var(--accent); color: var(--bg-primary); border: none; font-weight: 600; }
        .btn-custom-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); }

        .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; }
        .toast-custom { background: var(--bg-card); color: var(--text-primary); padding: 12px 20px; border-radius: 10px; border-left: 4px solid var(--accent); box-shadow: 0 4px 20px rgba(0,0,0,0.4); font-weight: 500; font-size: 0.9rem; }

        .fullscreen-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-primary); z-index: 9999; display: none; flex-direction: column; }
        .fullscreen-modal.active { display: flex; }
        .fullscreen-header { background: var(--bg-card); border-bottom: 1px solid var(--border-color); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
        .fullscreen-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 12px; }
        .fullscreen-actions { display: flex; gap: 8px; }
        .fullscreen-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--bg-secondary); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-primary); transition: all 0.2s; text-decoration: none; }
        .fullscreen-btn:hover { background: var(--bg-hover); }
        .fullscreen-iframe { flex: 1; width: 100%; border: none; background: #ffffff; }

        @media (max-width: 576px) {
            .links-list { grid-template-columns: 1fr; }
            .link-row { height: 90px; padding: 12px; }
            .link-favicon { width: 40px; height: 40px; }
            .link-title { font-size: 0.9rem; }
            .link-url { font-size: 0.7rem; }
            .link-actions { display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 4px; padding-left: 8px; border-left: 1px solid var(--border-color); }
            .link-action-btn { width: 32px; height: 32px; font-size: 0.9rem; }
            .link-action-btn i { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <div class="header-left">
                <a href="index.html" class="header-btn" title="Back to Home"><i class="bi bi-arrow-left"></i></a>
                <h5 class="header-title mb-0">LINKS</h5>
            </div>
            <button class="add-btn admin-only-btn" onclick="openAddModal()" style="display:none;">
                <i class="bi bi-plus-lg"></i> Add Link
            </button>
        </div>
    </header>

    <div class="page-container">
        <div class="search-container">
            <i class="bi bi-search search-icon"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="Search links..." oninput="filterLinks()">
        </div>

        <div class="category-filter" id="categoryFilter">
            <div class="category-chip active" onclick="filterByCategory('all')">All</div>
            <div class="category-chip" onclick="filterByCategory('social')">Social</div>
            <div class="category-chip" onclick="filterByCategory('news')">News</div>
            <div class="category-chip" onclick="filterByCategory('shopping')">Shopping</div>
            <div class="category-chip" onclick="filterByCategory('entertainment')">Entertainment</div>
            <div class="category-chip" onclick="filterByCategory('education')">Education</div>
            <div class="category-chip" onclick="filterByCategory('other')">Other</div>
        </div>

        <div class="links-list" id="linksList">
            <div class="loading-container">
                <div class="spinner-border" role="status"></div>
                <div style="margin-top: 10px;">Loading links...</div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Link Modal -->
    <div class="modal fade" id="linkModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Link</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="linkForm">
                        <input type="hidden" id="linkId">
                        <div class="mb-3"><label class="form-label">Website URL *</label><input type="url" class="form-control" id="linkUrl" placeholder="https://example.com" required></div>
                        <div class="mb-3"><label class="form-label">Title *</label><input type="text" class="form-control" id="linkTitle" placeholder="e.g., Google" required></div>
                        <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" id="linkDescription" rows="3" placeholder="Brief description (optional)"></textarea></div>
                        <div class="mb-3"><label class="form-label">Category</label><select class="form-select" id="linkCategory"><option value="social">Social Media</option><option value="news">News</option><option value="shopping">Shopping</option><option value="entertainment">Entertainment</option><option value="education">Education</option><option value="other">Other</option></select></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-custom-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-custom-primary" onclick="saveLink()">Save Link</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Full Screen Modal -->
    <div class="fullscreen-modal" id="fullscreenModal">
        <div class="fullscreen-header">
            <div class="fullscreen-title" id="fullscreenTitle">Loading...</div>
            <div class="fullscreen-actions">
                <button class="fullscreen-btn" onclick="openInNewTab()" title="Open in New Tab"><i class="bi bi-box-arrow-up-right"></i></button>
                <button class="fullscreen-btn" onclick="closeFullscreen()" title="Close"><i class="bi bi-x-lg"></i></button>
            </div>
        </div>
        <iframe class="fullscreen-iframe" id="fullscreenIframe" src=""></iframe>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const firebaseConfig = {
  apiKey: "AIzaSyAeOf5HQZMay4QVID8-x0PzUIo84d-XS_k",
  authDomain: "my-vid-ccddc.firebaseapp.com",
  projectId: "my-vid-ccddc",
  storageBucket: "my-vid-ccddc.firebasestorage.app",
  messagingSenderId: "510082359037",
  appId: "1:510082359037:web:361277a4774d68e746a894",
  measurementId: "G-Q2CQ01NTQ9"
};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allLinks = [];
        let currentCategory = 'all';
        let searchQuery = '';
        let linkModalInstance = null;
        let currentLinkUrl = '';
        let isAdminLoggedIn = false;

        // Auth State Listener
        auth.onAuthStateChanged(user => {
            isAdminLoggedIn = !!user;
            updateAdminUI();
        });
        if (localStorage.getItem('mero_admin_logged_in') === 'true') {
            isAdminLoggedIn = true;
            updateAdminUI();
        }

        function updateAdminUI() {
            document.querySelectorAll('.admin-only-btn').forEach(btn => {
                btn.style.display = isAdminLoggedIn ? 'flex' : 'none';
            });
            renderLinks();
        }

        function checkAdminAccess(callback) {
            if (isAdminLoggedIn) {
                callback();
            } else {
                showToast('🔐 Admin login required');
                setTimeout(() => { window.location.href = 'index.html?login=action'; }, 1000);
            }
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('mero_app_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadLinks();
            // Handle ?open=ID from global search
            const params = new URLSearchParams(window.location.search);
            const openId = params.get('open');
            if (openId) {
                setTimeout(() => {
                    const link = allLinks.find(l => l.id === openId);
                    if (link) openInFullscreen(link.url, link.title);
                }, 1500);
            }
        });

        function loadLinks() {
            db.collection('links').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
                allLinks = [];
                snapshot.forEach(doc => { allLinks.push({ id: doc.id, ...doc.data() }); });
                renderLinks();
            }, error => { console.error('Error loading links:', error); showToast('Failed to load links'); });
        }

        function renderLinks() {
            const list = document.getElementById('linksList');
            let filtered = allLinks;
            if (currentCategory !== 'all') filtered = filtered.filter(link => link.category === currentCategory);
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(link => link.title.toLowerCase().includes(query) || (link.description && link.description.toLowerCase().includes(query)) || link.url.toLowerCase().includes(query));
            }
            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="bi bi-link-45deg"></i><h5>No links found</h5><p>${searchQuery || currentCategory !== 'all' ? 'Try different filters' : 'Add your first link to get started'}</p></div>`;
                return;
            }
            list.innerHTML = filtered.map(link => {
                const favicon = getFaviconUrl(link.url);
                const catClass = `cat-${link.category || 'other'}`;
                return `
                    <div class="link-row">
                        <div class="link-favicon">
                            <img src="${favicon}" alt="" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'bi bi-link-45deg\\'></i>'">
                        </div>
                        <div class="link-content" onclick="openInFullscreen('${escapeAttr(link.url)}', '${escapeAttr(link.title)}')">
                            <div class="link-title">${escapeHtml(link.title)}</div>
                            <div class="link-url">${escapeHtml(link.url)}</div>
                            <div class="link-meta"><span class="link-category ${catClass}">${link.category || 'Other'}</span></div>
                        </div>
                        <div class="link-actions">
                            <button class="link-action-btn visit" onclick="openInFullscreen('${escapeAttr(link.url)}', '${escapeAttr(link.title)}')" title="Open in App"><i class="bi bi-arrows-fullscreen"></i></button>
                            <a href="${escapeHtml(link.url)}" target="_blank" class="link-action-btn visit" title="Open in New Tab" onclick="event.stopPropagation()"><i class="bi bi-box-arrow-up-right"></i></a>
                            ${isAdminLoggedIn ? `
                            <button class="link-action-btn" onclick="event.stopPropagation(); editLink('${link.id}')" title="Edit"><i class="bi bi-pencil"></i></button>
                            <button class="link-action-btn delete" onclick="event.stopPropagation(); deleteLink('${link.id}')" title="Delete"><i class="bi bi-trash"></i></button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openInFullscreen(url, title) {
            currentLinkUrl = url;
            document.getElementById('fullscreenTitle').textContent = title;
            document.getElementById('fullscreenIframe').src = url;
            document.getElementById('fullscreenModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        function openInNewTab() { if (currentLinkUrl) window.open(currentLinkUrl, '_blank'); }
        function closeFullscreen() { document.getElementById('fullscreenModal').classList.remove('active'); document.getElementById('fullscreenIframe').src = ''; document.body.style.overflow = ''; currentLinkUrl = ''; }

        function getFaviconUrl(url) { try { const domain = new URL(url).hostname; return `https://www.google.com/s2/favicons?domain=${domain}&sz=128`; } catch (e) { return ''; } }
        function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function escapeAttr(text) { if (!text) return ''; return text.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

        function filterByCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(chip => { chip.classList.remove('active'); if (chip.textContent.toLowerCase().includes(category) || (category === 'all' && chip.textContent.includes('All'))) chip.classList.add('active'); });
            renderLinks();
        }
        function filterLinks() { searchQuery = document.getElementById('searchInput').value; renderLinks(); }

        function openAddModal() { checkAdminAccess(() => { document.getElementById('modalTitle').textContent = 'Add Link'; document.getElementById('linkForm').reset(); document.getElementById('linkId').value = ''; if (!linkModalInstance) linkModalInstance = new bootstrap.Modal(document.getElementById('linkModal')); linkModalInstance.show(); }); }

        function editLink(id) { checkAdminAccess(() => { const link = allLinks.find(l => l.id === id); if (!link) return; document.getElementById('modalTitle').textContent = 'Edit Link'; document.getElementById('linkId').value = id; document.getElementById('linkUrl').value = link.url; document.getElementById('linkTitle').value = link.title; document.getElementById('linkDescription').value = link.description || ''; document.getElementById('linkCategory').value = link.category || 'other'; if (!linkModalInstance) linkModalInstance = new bootstrap.Modal(document.getElementById('linkModal')); linkModalInstance.show(); }); }

        async function saveLink() {
            if (!isAdminLoggedIn) { showToast('🔐 Session expired'); window.location.href = 'index.html?login=save'; return; }
            const id = document.getElementById('linkId').value;
            const url = document.getElementById('linkUrl').value.trim();
            const title = document.getElementById('linkTitle').value.trim();
            const description = document.getElementById('linkDescription').value.trim();
            const category = document.getElementById('linkCategory').value;
            if (!url || !title) { showToast('Please fill all required fields'); return; }
            if (!url.match(/^https?:\/\/.+/)) { showToast('Please enter a valid URL'); return; }
            try {
                const data = { url, title, description, category, updatedAt: new Date() };
                if (id) { await db.collection('links').doc(id).update(data); showToast('Link updated!'); }
                else { data.createdAt = new Date(); await db.collection('links').add(data); showToast('Link added!'); }
                linkModalInstance.hide();
            } catch (error) { console.error('Error saving link:', error); showToast('Failed to save link'); }
        }

        async function deleteLink(id) { checkAdminAccess(async () => { if (!confirm('Are you sure you want to delete this link?')) return; try { await db.collection('links').doc(id).delete(); showToast('Link deleted'); } catch (error) { console.error('Error deleting link:', error); showToast('Failed to delete link'); } }); }

        function showToast(message) { const container = document.getElementById('toastContainer'); const toast = document.createElement('div'); toast.className = 'toast-custom'; toast.textContent = message; container.appendChild(toast); setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 2500); }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeFullscreen(); });
    </script>
</body>
</html>
